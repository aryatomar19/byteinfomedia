<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none" role="img" aria-label="SEO optimization illustration">
  <defs>
    <linearGradient id="seo-bg" x1="0" y1="0" x2="400" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060B23"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="seo-orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF8A5C"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <filter id="seo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="160" fill="url(#seo-bg)"/>
  <circle cx="320" cy="40" r="60" fill="#FF6B35" opacity="0.08"/>
  <circle cx="60" cy="120" r="40" fill="#FF6B35" opacity="0.06"/>
  <!-- Search bar -->
  <rect x="40" y="28" width="180" height="36" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  <circle cx="58" cy="46" r="8" stroke="#FF6B35" stroke-width="2"/>
  <path d="M64 52l5 5" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
  <rect x="76" y="40" width="90" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="76" y="52" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.08)"/>
  <!-- Ranking list -->
  <rect x="40" y="78" width="130" height="62" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="54" y="100" fill="#FF6B35" font-size="11" font-family="system-ui,sans-serif" font-weight="700">#1</text>
  <rect x="72" y="92" width="80" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="54" y="118" fill="rgba(255,255,255,0.5)" font-size="11" font-family="system-ui,sans-serif" font-weight="700">#2</text>
  <rect x="72" y="110" width="65" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <text x="54" y="136" fill="rgba(255,255,255,0.3)" font-size="11" font-family="system-ui,sans-serif" font-weight="700">#3</text>
  <rect x="72" y="128" width="50" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
  <!-- Growth chart -->
  <rect x="200" y="50" width="160" height="90" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <path d="M220 115 L245 95 L270 100 L295 70 L320 55 L345 40" stroke="url(#seo-orange)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#seo-glow)"/>
  <circle cx="345" cy="40" r="5" fill="#FF6B35"/>
  <rect x="220" y="125" width="20" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="250" y="125" width="20" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="280" y="125" width="20" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="310" y="125" width="20" height="4" rx="2" fill="#FF6B35" opacity="0.6"/>
</svg>
