<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none" role="img" aria-label="Content writing illustration">
  <defs>
    <linearGradient id="content-bg" x1="0" y1="0" x2="400" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1228"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="160" fill="url(#content-bg)"/>
  <circle cx="80" cy="50" r="50" fill="#FF6B35" opacity="0.06"/>
  <!-- Writing workspace / editor -->
  <rect x="48" y="22" width="200" height="116" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <rect x="48" y="22" width="200" height="24" rx="14" fill="rgba(255,255,255,0.06)"/>
  <rect x="48" y="34" width="200" height="12" fill="rgba(255,255,255,0.06)"/>
  <circle cx="64" cy="34" r="4" fill="#FF6B35" opacity="0.7"/>
  <circle cx="76" cy="34" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="88" cy="34" r="4" fill="rgba(255,255,255,0.2)"/>
  <!-- Headline -->
  <rect x="64" y="58" width="120" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="64" y="72" width="160" height="5" rx="2.5" fill="rgba(255,255,255,0.12)"/>
  <rect x="64" y="82" width="150" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="64" y="92" width="140" height="5" rx="2.5" fill="rgba(255,255,255,0.08)"/>
  <rect x="64" y="102" width="100" height="5" rx="2.5" fill="rgba(255,255,255,0.08)"/>
  <!-- Pen / writing tool -->
  <g transform="translate(270,40) rotate(-35)">
    <rect x="0" y="0" width="12" height="70" rx="4" fill="url(#content-pen)"/>
    <polygon points="0,70 6,88 12,70" fill="#FF6B35"/>
    <rect x="2" y="8" width="8" height="14" rx="2" fill="rgba(255,255,255,0.2)"/>
  </g>
  <defs>
    <linearGradient id="content-pen" x1="0" y1="0" x2="0" y2="70">
      <stop stop-color="#FF8A5C"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>
  <!-- Blog cards stack -->
  <rect x="290" y="72" width="80" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="298" y="80" width="48" height="6" rx="3" fill="#FF6B35" opacity="0.7"/>
  <rect x="298" y="92" width="64" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="298" y="100" width="56" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="298" y="108" width="40" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <!-- Copywriting tag -->
  <rect x="290" y="28" width="88" height="32" rx="10" fill="rgba(255,107,53,0.12)" stroke="rgba(255,107,53,0.3)"/>
  <text x="304" y="49" fill="#FF6B35" font-size="10" font-family="system-ui,sans-serif" font-weight="700">Copywriting</text>
</svg>
