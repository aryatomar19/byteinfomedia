<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none" role="img" aria-label="Website development illustration">
  <defs>
    <linearGradient id="web-bg" x1="0" y1="0" x2="400" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060B23"/>
      <stop offset="1" stop-color="#162040"/>
    </linearGradient>
  </defs>
  <rect width="400" height="160" fill="url(#web-bg)"/>
  <ellipse cx="200" cy="150" rx="120" ry="30" fill="#FF6B35" opacity="0.06"/>
  <!-- Browser window -->
  <rect x="60" y="20" width="200" height="120" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
  <rect x="60" y="20" width="200" height="22" rx="12" fill="rgba(255,255,255,0.08)"/>
  <rect x="60" y="32" width="200" height="10" fill="rgba(255,255,255,0.08)"/>
  <circle cx="76" cy="31" r="4" fill="#FF6B35" opacity="0.8"/>
  <circle cx="88" cy="31" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="100" cy="31" r="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="120" y="27" width="80" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <!-- UI blocks -->
  <rect x="72" y="52" width="80" height="40" rx="6" fill="rgba(255,107,53,0.15)" stroke="rgba(255,107,53,0.3)"/>
  <rect x="160" y="52" width="84" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="160" y="66" width="70" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="160" y="76" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.08)"/>
  <rect x="72" y="100" width="50" height="16" rx="8" fill="#FF6B35" opacity="0.8"/>
  <rect x="130" y="100" width="50" height="16" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <!-- Code brackets -->
  <rect x="280" y="28" width="96" height="80" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <text x="296" y="52" fill="#FF6B35" font-size="14" font-family="monospace" font-weight="700">&lt;/&gt;</text>
  <rect x="296" y="60" width="56" height="4" rx="2" fill="rgba(255,107,53,0.5)"/>
  <rect x="304" y="70" width="48" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="304" y="80" width="40" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="296" y="90" width="52" height="4" rx="2" fill="rgba(255,107,53,0.3)"/>
  <!-- Responsive devices -->
  <rect x="290" y="118" width="36" height="28" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
  <rect x="332" y="110" width="22" height="36" rx="5" fill="rgba(255,255,255,0.05)" stroke="#FF6B35" stroke-width="1.5" opacity="0.8"/>
  <rect x="336" y="116" width="14" height="3" rx="1.5" fill="#FF6B35" opacity="0.6"/>
</svg>
