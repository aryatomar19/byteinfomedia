<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none" role="img" aria-label="Google Ads management illustration">
  <defs>
    <linearGradient id="ads-bg" x1="0" y1="0" x2="400" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F1C"/>
      <stop offset="1" stop-color="#141D35"/>
    </linearGradient>
    <linearGradient id="ads-orange" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FF9A6C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="160" fill="url(#ads-bg)"/>
  <ellipse cx="350" cy="130" rx="80" ry="50" fill="#FF6B35" opacity="0.07"/>
  <!-- Ad card -->
  <rect x="36" y="24" width="150" height="112" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
  <rect x="36" y="24" width="150" height="28" rx="14" fill="rgba(255,107,53,0.15)"/>
  <rect x="36" y="38" width="150" height="14" fill="rgba(255,107,53,0.15)"/>
  <text x="52" y="42" fill="#FF6B35" font-size="9" font-family="system-ui,sans-serif" font-weight="700">SPONSORED</text>
  <rect x="52" y="64" width="100" height="7" rx="3.5" fill="rgba(255,255,255,0.22)"/>
  <rect x="52" y="78" width="80" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="52" y="90" width="90" height="5" rx="2.5" fill="rgba(255,255,255,0.08)"/>
  <rect x="52" y="108" width="70" height="18" rx="9" fill="url(#ads-orange)"/>
  <text x="68" y="121" fill="white" font-size="9" font-family="system-ui,sans-serif" font-weight="700">Click Ad</text>
  <!-- Performance metrics -->
  <rect x="210" y="24" width="154" height="52" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <text x="226" y="46" fill="rgba(255,255,255,0.5)" font-size="9" font-family="system-ui,sans-serif">CTR</text>
  <text x="226" y="64" fill="#FF6B35" font-size="18" font-family="system-ui,sans-serif" font-weight="800">4.8%</text>
  <rect x="290" y="36" width="58" height="28" rx="8" fill="rgba(255,107,53,0.12)"/>
  <path d="M298 56 L310 44 L322 50 L346 32" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
  <!-- ROI badge -->
  <rect x="210" y="88" width="72" height="48" rx="12" fill="rgba(255,107,53,0.12)" stroke="rgba(255,107,53,0.25)"/>
  <text x="222" y="108" fill="rgba(255,255,255,0.5)" font-size="8" font-family="system-ui,sans-serif">ROI</text>
  <text x="222" y="126" fill="#FF6B35" font-size="16" font-family="system-ui,sans-serif" font-weight="800">312%</text>
  <!-- Target / campaign -->
  <rect x="296" y="88" width="68" height="48" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="330" cy="106" r="14" stroke="#FF6B35" stroke-width="2"/>
  <circle cx="330" cy="106" r="6" fill="#FF6B35"/>
  <path d="M330 92v-4M330 120v4M316 106h-4M344 106h4" stroke="#FF6B35" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <rect x="306" y="124" width="48" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
</svg>
