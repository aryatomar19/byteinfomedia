<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none" role="img" aria-label="Analytics and reporting illustration">
  <defs>
    <linearGradient id="analytics-bg" x1="0" y1="0" x2="400" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F1C"/>
      <stop offset="1" stop-color="#0C1528"/>
    </linearGradient>
  </defs>
  <rect width="400" height="160" fill="url(#analytics-bg)"/>
  <circle cx="340" cy="30" r="50" fill="#FF6B35" opacity="0.07"/>
  <!-- KPI cards row -->
  <rect x="28" y="24" width="64" height="44" rx="10" fill="rgba(255,107,53,0.1)" stroke="rgba(255,107,53,0.25)"/>
  <text x="40" y="42" fill="rgba(255,255,255,0.45)" font-size="8" font-family="system-ui,sans-serif">Sessions</text>
  <text x="40" y="58" fill="#FF6B35" font-size="14" font-family="system-ui,sans-serif" font-weight="800">24.5K</text>
  <rect x="100" y="24" width="64" height="44" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <text x="112" y="42" fill="rgba(255,255,255,0.45)" font-size="8" font-family="system-ui,sans-serif">Conv.</text>
  <text x="112" y="58" fill="white" font-size="14" font-family="system-ui,sans-serif" font-weight="800">8.2%</text>
  <rect x="172" y="24" width="64" height="44" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <text x="184" y="42" fill="rgba(255,255,255,0.45)" font-size="8" font-family="system-ui,sans-serif">Revenue</text>
  <text x="184" y="58" fill="white" font-size="14" font-family="system-ui,sans-serif" font-weight="800">$48K</text>
  <!-- Bar chart -->
  <rect x="28" y="80" width="120" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="44" y="118" width="14" height="18" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="64" y="108" width="14" height="28" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="84" y="98" width="14" height="38" rx="3" fill="rgba(255,107,53,0.5)"/>
  <rect x="104" y="88" width="14" height="48" rx="3" fill="#FF6B35"/>
  <text x="40" y="96" fill="rgba(255,255,255,0.4)" font-size="8" font-family="system-ui,sans-serif">Monthly</text>
  <!-- Pie / donut chart -->
  <rect x="160" y="80" width="100" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="210" cy="112" r="24" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
  <circle cx="210" cy="112" r="24" stroke="#FF6B35" stroke-width="8" stroke-dasharray="60 90" stroke-linecap="round" transform="rotate(-90 210 112)"/>
  <text x="200" y="116" fill="white" font-size="10" font-family="system-ui,sans-serif" font-weight="700">67%</text>
  <!-- Report document -->
  <rect x="272" y="24" width="100" height="120" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <rect x="288" y="40" width="56" height="6" rx="3" fill="#FF6B35" opacity="0.7"/>
  <rect x="288" y="54" width="68" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="288" y="64" width="60" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <path d="M288 82 L310 70 L332 78 L356 58" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" fill="none"/>
  <rect x="288" y="96" width="68" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="288" y="106" width="52" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="288" y="124" width="40" height="10" rx="5" fill="rgba(255,107,53,0.2)" stroke="rgba(255,107,53,0.4)"/>
  <text x="296" y="132" fill="#FF6B35" font-size="7" font-family="system-ui,sans-serif" font-weight="700">Report</text>
</svg>
